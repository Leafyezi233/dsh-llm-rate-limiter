name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: node test-strategies.mjs

      - name: Run status channel tests
        run: node test-status-rpc.mjs

      - name: Run client bundle tests
        run: node test-client-bundle.mjs

      - name: Run host integration tests
        run: node test-host-integration.mjs

      - name: Run status route regression tests
        run: node test-status-route.mjs

      - name: Check syntax (host)
        run: node --check lib/index.js

      - name: Check syntax (status rpc)
        run: node --check lib/status-rpc.js

      - name: Check syntax (client)
        run: node --check lib/client.js
